name: 品牌库检查

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 品牌库检查（字段、标志图片、编号、每期用的品牌）
        run: python3 tools/brand.py check
